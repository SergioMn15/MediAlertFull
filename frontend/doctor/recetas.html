<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediAlert - Recetas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div id="toast-container" class="toast-container"></div>

  <div class="app-container">
    <header id="header-container"></header>

    <div class="doctor-layout">
      <div id="sidebar-container"></div>

      <main class="main-content">
        <div class="content-header">
          <div>
            <h2>Recetas</h2>
            <p>Editar, pausar y eliminar recetas del doctor.</p>
          </div>
        </div>

        <section>
          <div class="content-actions">
            <div class="filter-box" style="min-width: 260px;">
              <label class="filter-label" for="search-prescriptions">Buscar</label>
              <input id="search-prescriptions" type="text" placeholder="Paciente o receta..." style="width: 100%;" />
            </div>

            <div class="filter-box">
              <label class="filter-label" for="status-filter">Estado</label>
              <select id="status-filter" style="width: 100%;">
                <option value="">Todos</option>
                <option value="active">Activa</option>
                <option value="requested">Solicitud pendiente</option>
                <option value="paused">Pausada</option>
              </select>
            </div>
          </div>
        </section>

        <section style="margin-top: 14px;">
          <div class="stats-grid">
            <article class="stat-card">
              <span>Total</span>
              <strong id="total-prescriptions">0</strong>
            </article>
            <article class="stat-card">
              <span>Activas</span>
              <strong id="active-prescriptions">0</strong>
            </article>
            <article class="stat-card">
              <span>Pausadas</span>
              <strong id="paused-prescriptions">0</strong>
            </article>
            <article class="stat-card">
              <span>Pendientes</span>
              <strong id="pending-requests">0</strong>
            </article>
          </div>
        </section>

        <section style="margin-top: 14px;">
          <div id="prescription-list" class="medication-list">
            <div class="empty-state">Cargando recetas...</div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <!-- Modal de edición (requerido por doctor-dashboard.js) -->
  <div id="edit-prescription-modal" class="modal-overlay hidden" aria-hidden="true">
    <div class="modal-card modal-card-wide">
      <div class="content-header">
        <div>
          <h2>Editar receta</h2>
          <p>Actualiza diagnostico, indicaciones y medicamentos.</p>
        </div>
        <button class="btn btn-outline btn-small close-modal" type="button">Cerrar</button>
      </div>

      <form id="edit-prescription-form" class="modal-form">
        <input type="hidden" id="edit-prescription-id" />

        <div class="form-group">
          <label for="edit-patient-name">Paciente</label>
          <input id="edit-patient-name" type="text" disabled />
        </div>

        <div class="form-group">
          <label for="edit-diagnosis">Diagnostico</label>
          <textarea id="edit-diagnosis" rows="2" placeholder="Diagnostico"></textarea>
        </div>

        <div class="form-group">
          <label for="edit-general-instructions">Indicaciones generales</label>
          <textarea id="edit-general-instructions" rows="3" placeholder="Indicaciones"></textarea>
        </div>

        <div class="content-header" style="margin-top: 0;">
          <div>
            <h2>Medicamentos</h2>
            <p>Edita cada medicamento.</p>
          </div>
        </div>

        <div id="edit-medications-container">
          <div id="edit-medications-list"></div>
        </div>

        <div class="pill-row">
          <button type="button" id="add-edit-medication" class="btn btn-outline">Agregar medicamento</button>
          <button type="submit" class="btn btn-primary">Guardar cambios</button>
        </div>\n      </form>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/doctor-dashboard.js"></script>
</body>
</html>
